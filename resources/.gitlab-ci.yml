# GitLab CI/CD Pipeline for NSO Package Deployment (DEVWKS-2618)
#
# Feature branch: .pre → build → test → deploy_feat
# Main branch:    deliver → deploy_prod → .post verify

include:
  - 'pipeline_utils/environments.yml'

stages:
  - build
  - test
  - deploy_feat
  - deliver
  - deploy_prod

variables:
  NSO_VERSION: "6.4.4"
  NSO_RC_PATH: "/opt/ncs/ncs-${NSO_VERSION}/ncsrc"
  NSO_RUN_PATH: "/nso/run"
  SSH_OPTS: "-o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o LogLevel=ERROR"

.base_job:
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      PYATS_PYTHON=""
      for _pyats_bin in \
        "$HOME/.local/share/pipx/venvs/pyats/bin/python3"* \
        "$HOME/.local/pipx/venvs/pyats/bin/python3"*; do
        if [ -x "$_pyats_bin" ] && [[ "$_pyats_bin" != *config* ]]; then
          PYATS_PYTHON="$_pyats_bin"
          break
        fi
      done
      if [ -z "$PYATS_PYTHON" ]; then PYATS_PYTHON=python3; fi
      export PYATS_PYTHON
    - 'ssh-keyscan -H "$NSO_DEV_IP" "$NSO_PROD_IP" 2>/dev/null >> ~/.ssh/known_hosts'
  timeout: 10 minutes

runner pre-reqs:
  stage: .pre
  extends: .base_job
  timeout: 15 minutes
  script:
    - python3 --version
    - 'command -v sshpass || (echo "ERROR sshpass not installed on runner" && exit 1)'
    - |
      if ! "$PYATS_PYTHON" -c "from pyats import aetest" 2>/dev/null; then
        pipx install "pyats[library]>=23.11" --include-deps --force
        PYATS_PYTHON=$(find "$HOME/.local/share/pipx/venvs/pyats/bin" "$HOME/.local/pipx/venvs/pyats/bin" -maxdepth 1 -name 'python3*' -type f 2>/dev/null | grep -v config | head -1)
        export PYATS_PYTHON
      fi
    - |
      if ! command -v robot >/dev/null; then
        pipx install robotframework-sshlibrary --include-deps --force
      fi
    - '"$PYATS_PYTHON" -c "from pyats import aetest; print(\"pyATS OK\")"'
    - robot --version || true
    - 'sshpass -p "$NSO_DEV_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_DEV_IP "echo OK" || (echo "Dev unreachable" && exit 1)'
    - 'sshpass -p "$NSO_PROD_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_PROD_IP "echo OK" || (echo "Prod unreachable" && exit 1)'
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

package-compilation:
  stage: build
  extends: .base_job
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - 'echo "Package: $PACKAGE | Commit: $CI_COMMIT_SHORT_SHA"'
    - sshpass -p "$NSO_DEV_PWD" scp $SSH_OPTS -r packages/$PACKAGE $NSO_DEV_USER@$NSO_DEV_IP:/home/developer/$PACKAGE
    - |
      sshpass -p "$NSO_DEV_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_DEV_IP "
        set -e && cd /home/developer/ &&
        cp -r $PACKAGE $NSO_RUN_PATH/packages/ &&
        source $NSO_RC_PATH &&
        cd $NSO_RUN_PATH/packages/$PACKAGE/src &&
        make clean && make &&
        cd $NSO_RUN_PATH/packages &&
        tar -czf /home/developer/nso-package_$PACKAGE.tar.gz $PACKAGE
      "
    - sshpass -p "$NSO_DEV_PWD" scp $SSH_OPTS $NSO_DEV_USER@$NSO_DEV_IP:/home/developer/nso-package_$PACKAGE.tar.gz .
  artifacts:
    paths: ["nso-package_*.tar.gz"]
    expire_in: 1 week
  retry:
    max: 2
    when: script_failure

package-load:
  stage: build
  extends: .base_job
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  needs: [package-compilation]
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - sshpass -p "$NSO_DEV_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_DEV_IP "source $NSO_RC_PATH && echo 'packages reload' | ncs_cli -Cu admin"

test-loopback-service:
  stage: test
  extends: .base_job
  timeout: 20 minutes
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  needs: [package-load]
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - cd tests/loopback-test
    - '"$PYATS_PYTHON" loopback-test.py --nso_url "http://$NSO_DEV_IP:8080" --device "dev-core-rtr01" --username "$NSO_DEV_USER" --password "$NSO_DEV_PWD" 2>&1 | tee test-xr.log'
    - '"$PYATS_PYTHON" loopback-test.py --nso_url "http://$NSO_DEV_IP:8080" --device "dev-dist-rtr01" --username "$NSO_DEV_USER" --password "$NSO_DEV_PWD" 2>&1 | tee test-ios.log'
  after_script:
    - 'cd tests/loopback-test && ls -lh *.log 2>/dev/null || echo "No log files generated"'
  artifacts:
    when: always
    paths: [tests/loopback-test/*.log]
    expire_in: 30 days
  retry:
    max: 1
    when: script_failure

prepare-production-artifact:
  stage: deliver
  extends: .base_job
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - sshpass -p "$NSO_DEV_PWD" scp $SSH_OPTS $NSO_DEV_USER@$NSO_DEV_IP:/home/developer/nso-package_$PACKAGE.tar.gz .
    - 'tar -tzf nso-package_$PACKAGE.tar.gz > /dev/null || (echo "ERROR Corrupted tarball" && exit 1)'
    - 'tar -tzf nso-package_$PACKAGE.tar.gz | grep -E "\.(so|fxs)$" > /dev/null || echo "WARNING No compiled binaries"'
  artifacts:
    paths: ["nso-package_*.tar.gz"]
    expire_in: 1 week

deploy-to-production:
  stage: deploy_prod
  extends: .base_job
  timeout: 15 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  needs: [prepare-production-artifact]
  resource_group: production-nso
  environment:
    name: production
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - sshpass -p "$NSO_PROD_PWD" scp $SSH_OPTS nso-package_$PACKAGE.tar.gz $NSO_DEV_USER@$NSO_PROD_IP:/home/developer/
    - |
      sshpass -p "$NSO_PROD_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_PROD_IP "
        set -e && cd /home/developer/ &&
        tar -xzf nso-package_$PACKAGE.tar.gz &&
        [ -d \"$NSO_RUN_PATH/packages/loopback\" ] && mv $NSO_RUN_PATH/packages/loopback $NSO_RUN_PATH/packages/loopback.backup.\$(date +%Y%m%d_%H%M%S) || true &&
        cp -r $PACKAGE $NSO_RUN_PATH/packages/loopback &&
        source $NSO_RC_PATH &&
        echo 'packages reload' | ncs_cli -Cu admin &&
        echo 'show packages package $PACKAGE oper-status' | ncs_cli -Cu admin &&
        rm -f nso-package_$PACKAGE.tar.gz
      "

verify-production-deployment:
  stage: .post
  extends: .base_job
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  needs: [deploy-to-production]
  script:
    - 'test -n "$PACKAGE" || (echo "ERROR PACKAGE is required" && exit 1)'
    - |
      sshpass -p "$NSO_PROD_PWD" ssh $SSH_OPTS $NSO_DEV_USER@$NSO_PROD_IP "
        source $NSO_RC_PATH &&
        echo 'show packages package $PACKAGE oper-status' | ncs_cli -Cu admin | grep -q 'up' &&
        echo 'Package operational in production'
      "

